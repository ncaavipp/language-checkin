<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毎日チェックイン (Daily Language Check-in)</title>
    <style>
        body { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
        h2 { color: #333; margin-top: 0; font-size: 1.25rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1rem; font-family: inherit; }
        button { background: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        #response-box { margin-top: 16px; padding: 12px 14px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; display: none; color: #1e40af; font-size: 0.95rem; }
        #history-list { margin-top: 16px; max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .history-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 14px; background: #f8fafc; }
        .history-card.pending { border-color: #fcd34d; background: #fffbeb; }
        .history-date { font-size: 0.8rem; color: #64748b; margin-bottom: 6px; font-weight: 600; }
        .badge-pending { display: inline-block; background: #fef3c7; color: #92400e; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
        .history-student { font-size: 0.95rem; color: #1e293b; margin-bottom: 8px; white-space: pre-wrap; }
        .history-reply { font-size: 0.95rem; color: #1e40af; background: #eff6ff; padding: 8px 10px; border-radius: 6px; border-left: 3px solid #2563eb; white-space: pre-wrap; }
        .history-waiting { font-size: 0.85rem; color: #92400e; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h2>毎日チェックイン (Daily Check-in)</h2>
        <form id="checkinForm">
            <div class="form-group">
                <label for="name">なまえ (Your Name)</label>
                <input type="text" id="name" name="name" required placeholder="Jane Doe">
            </div>
            <div class="form-group">
                <label for="email">メールアドレス (Student Email)</label>
                <input type="email" id="email" name="email" required placeholder="student@school.edu">
            </div>
            <div class="form-group">
                <label for="pin">4けたのばんごう (4-Digit PIN)</label>
                <input type="text" id="pin" name="pin" maxlength="4" pattern="\d{4}" required placeholder="例：1234">
            </div>
            <div class="form-group">
                <label for="message">きょうのチェックイン (Today's Check-in in Japanese)</label>
                <textarea id="message" name="message" rows="3" required placeholder="日本語でチェックインしてください。"></textarea>
            </div>
            <button type="submit" id="submitBtn">そうしん (Submit Check-in)</button>
        </form>
        <div id="response-box"></div>
        <div id="history-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
