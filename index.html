<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Language Check-in</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
        h2 { color: #333; margin-top: 0; font-size: 1.25rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { background: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        #response-box { margin-top: 20px; padding: 15px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; display: none; color: #1e40af; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Daily Check-in</h2>
        <form id="checkinForm">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" required placeholder="Jane Doe">
            </div>
            <div class="form-group">
                <label for="email">Student Email</label>
                <input type="email" id="email" required placeholder="student@school.edu">
            </div>
            <div class="form-group">
                <label for="message">Today's Check-in (in Japanese)</label>
                <textarea id="message" rows="3" required placeholder="Ohayou gozaimasu! Kyou wa..."></textarea>
            </div>
            <button type="submit" id="submitBtn">Submit Check-in</button>
        </form>
        <div id="response-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
